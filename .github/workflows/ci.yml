name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a run if a newer one starts on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:typecheck

  unit-tests:
    name: Unit tests (coverage)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails the job automatically if coverage drops below the thresholds
      # configured in vitest.config.ts (coverage.thresholds).
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  e2e:
    name: E2E tests (Playwright)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      # playwright.config.ts builds and serves the production bundle when
      # CI is set, rather than the dev server, so this exercises what
      # actually ships.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  a11y:
    name: Accessibility tests (placeholder)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "TODO: wire up accessibility tests"
        run: echo "No automated a11y runner configured yet (e.g. jest-axe/axe-core or Pa11y). Replace this step once added."

  dependency-scan:
    name: Dependency scan - Snyk (placeholder)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "TODO: wire up Snyk"
        run: echo "Snyk not configured yet. Add a SNYK_TOKEN repo secret, then swap this step for snyk/actions/node."
